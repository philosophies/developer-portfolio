{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "npm",
      "directory": "/site",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 3
    },
    {
      "package-ecosystem": "npm",
      "directory": "/smart-brain-modernization",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 3
    },
    {
      "package-ecosystem": "nuget",
      "directory": "/backend",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 3
    },
    {
      "package-ecosystem": "nuget",
      "directory": "/backend.tests",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 3
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "monthly"
      },
      "open-pull-requests-limit": 3
    }
  ]
}
