name: Tests and dependency checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 14 1 * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: reporting
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d reporting"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Reporting: Host=localhost;Database=reporting;Username=demo;Password=local-demo-only
      PGPASSWORD: local-demo-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: psql -h localhost -U demo -d reporting -v ON_ERROR_STOP=1 -f backend/sql/001-schema.sql
      - run: dotnet restore backend.tests/Reporting.Tests.csproj --locked-mode
      - run: dotnet test backend.tests/Reporting.Tests.csproj --no-restore --logger trx --results-directory TestResults
      - run: dotnet list backend.tests/Reporting.Tests.csproj package --vulnerable --include-transitive --format json > nuget-audit.json
      - run: node scripts/check-nuget.mjs nuget-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-evidence
          path: |
            TestResults/
            nuget-audit.json
          retention-days: 30
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.0'
      - run: npm ci
        working-directory: smart-brain-modernization
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: smart-brain-modernization
      - run: ./automation/Test-AccessReview.ps1
        shell: pwsh
      - run: npm ci && npm run check && npm run build && npm audit --audit-level=high
        working-directory: site

